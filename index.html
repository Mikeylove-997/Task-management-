<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mike OS</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand"><span class="mark">M</span><div><strong>Mike OS</strong><small>Local task memory</small></div></div>
      <nav id="nav">
        <button class="active" data-status="all"><span>Overview</span><b id="count-all">0</b></button>
        <button data-status="inbox"><span>Inbox</span><b id="count-inbox">0</b></button>
        <button data-status="active"><span>Active</span><b id="count-active">0</b></button>
        <button data-status="backlog"><span>Backlog</span><b id="count-backlog">0</b></button>
        <button data-status="completed"><span>Completed</span><b id="count-completed">0</b></button>
      </nav>
      <a class="backup" href="/api/export" download="mike-os-backup.json">Export backup</a>
      <p class="local">● Stored locally</p>
    </aside>
    <main>
      <header>
        <div><p class="eyebrow">YOUR WORKSPACE</p><h1 id="page-title">Overview</h1><p id="date-line"></p></div>
        <button id="new-task" class="primary">+ New task</button>
      </header>

      <section class="command-card">
        <div class="spark">✦</div>
        <div class="command-content">
          <label for="command">Tell Mike OS what changed</label>
          <div class="command-row"><input id="command" placeholder="Try “add Update my LinkedIn due 2026-08-28”"><button id="send">Run</button></div>
          <p id="command-result">Works locally—no AI model or API required.</p>
        </div>
      </section>

      <section class="toolbar">
        <input id="search" placeholder="Search tasks, notes, or projects…">
        <span id="task-summary"></span>
      </section>
      <section id="task-list" class="task-list"></section>
    </main>
  </div>

  <dialog id="task-dialog">
    <form id="task-form">
      <div class="dialog-head"><div><p class="eyebrow">TASK DETAILS</p><h2 id="dialog-title">New task</h2></div><button type="button" class="icon" id="close">×</button></div>
      <input type="hidden" id="task-id">
      <label>Title<input id="title" required></label>
      <div class="grid">
        <label>Status<select id="status"><option value="inbox">Inbox</option><option value="active">Active</option><option value="backlog">Backlog</option><option value="completed">Completed</option></select></label>
        <label>Due date<input id="target-date" type="date"></label>
      </div>
      <label>Project<input id="project" placeholder="Personal, Career, Research…"></label>
      <label>Next action<input id="next-action" placeholder="The next concrete step"></label>
      <label>Notes<textarea id="notes" rows="4"></textarea></label>
      <label class="check"><input id="accomplishment" type="checkbox"> Mark as a meaningful accomplishment</label>
      <div id="history" class="history"></div>
      <div class="actions"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Save task</button></div>
    </form>
  </dialog>
  <script src="/app.js"></script>
</body>
</html>
